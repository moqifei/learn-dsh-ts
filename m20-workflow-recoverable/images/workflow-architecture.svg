<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="800" fill="#fafafa"/>
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0504d"/>
    </marker>
    <style>
      .title { font-size: 19px; font-weight: 700; fill: #1a1a2e; }
      .sect  { font-size: 14px; font-weight: 700; fill: #1a1a2e; }
      .lhead { font-size: 13px; font-weight: 700; fill: #fff; }
      .body  { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 10.5px; fill: #6b7280; }
      .edge  { font-size: 10.5px; fill: #555; }
      .note  { font-size: 11px; fill: #555; }
      .warn  { font-size: 11px; fill: #c0504d; }
      .chip  { font-size: 9.5px; fill: #0f172a; }
      .ctit  { font-size: 11px; font-weight: 700; fill: #1a1a2e; }
    </style>
  </defs>

  <text x="24" y="32" class="title">m20 · Workflow 可恢复 — 三角色 + 插件化驱动 + 只追加 journal</text>

  <!-- ============ ① 三角色 ============ -->
  <text x="24" y="60" class="sect">① 三角色：Definition / Provider / Consumer 各归其位</text>

  <!-- Consumer / runner -->
  <g>
    <rect x="24" y="70" width="196" height="186" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M24,80 a10,10 0 0 1 10,-10 h176 a10,10 0 0 1 10,10 v24 h-196 z" fill="#2563eb"/>
    <text x="122" y="92" text-anchor="middle" class="lhead">Consumer（runner）</text>
    <text x="40" y="128" class="body">• start(def, provider)</text>
    <text x="40" y="148" class="body">• resume(def, provider)</text>
    <text x="40" y="168" class="body">• 只解释定义，不执行阶段</text>
    <text x="40" y="188" class="body">• 监听 workflow/event</text>
    <text x="40" y="208" class="body">• 换 provider 只是换参数</text>
    <text x="40" y="228" class="body">• 持有 outputs 做断言</text>
    <text x="40" y="248" class="dim">（不知道阶段怎么跑）</text>
  </g>

  <!-- Definition + Consumer: WorkflowService -->
  <g>
    <rect x="316" y="70" width="224" height="186" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M316,80 a10,10 0 0 1 10,-10 h204 a10,10 0 0 1 10,10 v24 h-224 z" fill="#7c3aed"/>
    <text x="428" y="92" text-anchor="middle" class="lhead">Definition · WorkflowService</text>
    <text x="332" y="128" class="body">ctx.workflows（Service 单例）</text>
    <text x="332" y="148" class="body">• 命名 StageProvider 注册表</text>
    <text x="332" y="168" class="body">• registerProvider → disposer</text>
    <text x="332" y="188" class="body">• start / resume（到检查点停机）</text>
    <text x="332" y="208" class="body">• 只追加 journal（JSONL 落盘）</text>
    <text x="332" y="228" class="body">• validateJournal + foldOutputs</text>
    <text x="332" y="248" class="dim">（零硬编码任何 Provider）</text>
  </g>

  <!-- Providers -->
  <g>
    <rect x="640" y="70" width="236" height="58" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M640,79 a9,9 0 0 1 9,-9 h218 a9,9 0 0 1 9,9 v19 h-236 z" fill="#059669"/>
    <text x="654" y="89" class="lhead">Provider · local-echo（默认）</text>
    <text x="654" y="117" class="body">run(stage) → 确定性输出，便于断言</text>
  </g>
  <g>
    <rect x="640" y="136" width="236" height="58" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M640,145 a9,9 0 0 1 9,-9 h218 a9,9 0 0 1 9,9 v19 h-236 z" fill="#d97706"/>
    <text x="654" y="155" class="lhead">Provider · remote（可替换）</text>
    <text x="654" y="183" class="body">模拟 worker-thread，输出签名不同</text>
  </g>
  <g>
    <rect x="640" y="202" width="236" height="58" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <path d="M640,211 a9,9 0 0 1 9,-9 h218 a9,9 0 0 1 9,9 v19 h-236 z" fill="#94a3b8"/>
    <text x="654" y="221" class="lhead">Provider · subagent-driven</text>
    <text x="654" y="249" class="body">未注册 ⇒ 不存在，写插件即可获得</text>
  </g>
  <text x="758" y="278" text-anchor="middle" class="dim">当前注册表：local-echo, remote（两个对等插件）</text>

  <!-- 请求方向（上） -->
  <g stroke="#9ca3af" stroke-width="1.6" fill="none" marker-end="url(#arrA)">
    <line x1="222" y1="124" x2="312" y2="124"/>
    <line x1="542" y1="112" x2="636" y2="106"/>
  </g>
  <text x="267" y="117" text-anchor="middle" class="edge">按名申领 / 恢复</text>
  <text x="583" y="102" text-anchor="middle" class="edge">provider.run()</text>

  <!-- 回报方向（下） -->
  <g stroke="#9ca3af" stroke-width="1.6" fill="none" marker-end="url(#arrA)">
    <line x1="312" y1="212" x2="222" y2="212"/>
    <line x1="636" y1="180" x2="542" y2="186"/>
  </g>
  <text x="267" y="228" text-anchor="middle" class="edge">workflow/event</text>
  <text x="589" y="200" text-anchor="middle" class="edge">返回 stage 输出</text>

  <!-- ============ ② journal 只追加事件流 ============ -->
  <text x="24" y="306" class="sect">② journal 只追加事件流：7 类事件 append-only 落盘，从不编辑旧行</text>

  <!-- 启动分组 -->
  <g>
    <rect x="24" y="318" width="380" height="140" rx="9" fill="#eef3f8" stroke="#3a6ea5"/>
    <text x="36" y="338" class="ctit">① 启动 start(def, 'local-echo') → 6 行后刻意停机</text>
    <rect x="36" y="348" width="356" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="44" y="360" class="chip">seq0  workflow_started</text>
    <rect x="36" y="365" width="356" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="44" y="377" class="chip">seq1  stage_started ｜ failure-analysis</text>
    <rect x="36" y="382" width="356" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="44" y="394" class="chip">seq2  stage_completed ｜ provider=local-echo</text>
    <rect x="36" y="399" width="356" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="44" y="411" class="chip">seq3  stage_started ｜ recovery-analysis</text>
    <rect x="36" y="416" width="356" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="44" y="428" class="chip">seq4  stage_completed ｜ provider=local-echo</text>
    <rect x="36" y="433" width="356" height="17" rx="4" fill="#fff7e6" stroke="#d97706"/>
    <text x="44" y="445" class="chip">seq5  host_checkpoint ｜ completed / nextStage</text>
  </g>

  <!-- 停机 -->
  <g>
    <rect x="416" y="318" width="96" height="140" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="464" y="352" text-anchor="middle" font-size="18" fill="#b45309">⏸</text>
    <text x="464" y="382" text-anchor="middle" class="note">刻意停机</text>
    <text x="464" y="406" text-anchor="middle" class="note">主机重启</text>
    <text x="464" y="430" text-anchor="middle" class="dim">内存全丢</text>
    <text x="464" y="448" text-anchor="middle" class="dim">只剩日志</text>
  </g>

  <!-- 恢复分组 -->
  <g>
    <rect x="524" y="318" width="352" height="140" rx="9" fill="#e8f3ee" stroke="#2f6f59"/>
    <text x="536" y="338" class="ctit">② 恢复 resume(def, 'remote') → 只跑缺失</text>
    <rect x="536" y="348" width="328" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="544" y="360" class="chip">seq6  workflow_resumed</text>
    <rect x="536" y="365" width="328" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="544" y="377" class="chip">seq7  stage_started ｜ synthesis</text>
    <rect x="536" y="382" width="328" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="544" y="394" class="chip">seq8  stage_completed ｜ provider=remote</text>
    <rect x="536" y="399" width="328" height="17" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="544" y="411" class="chip">seq9  workflow_completed</text>
    <text x="544" y="434" class="dim">前两段跳过：stage.id in outputs → continue（计数仍为 1）</text>
    <text x="544" y="450" class="dim">热替换引擎：前半 local-echo · 后半 remote，校验语义不变</text>
  </g>

  <text x="24" y="486" class="note">关键：<tspan font-weight="700">host_checkpoint 是刻意事实</tspan>——它在阶段输出<b>已经落盘之后</b>才追加，只记录"已完成谁 / 下一步是谁"；<tspan fill="#c0504d" font-weight="700">权威跳过决策来自 stage_completed 事件</tspan>，不让汇总行变成第二个真相来源。</text>

  <!-- ============ ③ 恢复边界 ============ -->
  <text x="24" y="514" class="sect">③ 恢复边界：先验证完整前缀，不通过就拒绝，绝不猜测兼容</text>

  <g>
    <rect x="28" y="526" width="201" height="62" rx="8" fill="#e7f1f5" stroke="#246b7a"/>
    <text x="128" y="550" text-anchor="middle" class="body" font-weight="700">① validateJournal</text>
    <text x="128" y="572" text-anchor="middle" class="dim">校验完整前缀（8 类）</text>
  </g>
  <g>
    <rect x="242" y="526" width="201" height="62" rx="8" fill="#f3e8ff" stroke="#7c3aed"/>
    <text x="342" y="550" text-anchor="middle" class="body" font-weight="700">② foldOutputs</text>
    <text x="342" y="572" text-anchor="middle" class="dim">从 stage_completed 冷重建</text>
  </g>
  <g>
    <rect x="456" y="526" width="201" height="62" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="556" y="550" text-anchor="middle" class="body" font-weight="700">③ 跳过已完成阶段</text>
    <text x="556" y="572" text-anchor="middle" class="dim">in outputs → continue</text>
  </g>
  <g>
    <rect x="670" y="526" width="201" height="62" rx="8" fill="#e8f3ee" stroke="#2f6f59"/>
    <text x="770" y="550" text-anchor="middle" class="body" font-weight="700">④ 只跑缺失 + 收尾</text>
    <text x="770" y="572" text-anchor="middle" class="dim">append workflow_completed</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.6" fill="none" marker-end="url(#arrA)">
    <line x1="231" y1="557" x2="238" y2="557"/>
    <line x1="445" y1="557" x2="452" y2="557"/>
    <line x1="659" y1="557" x2="666" y2="557"/>
  </g>

  <text x="24" y="610" class="warn">篡改日志（version 1→2）→ resume 被拒："[journal] version 不匹配（definition 已变更）"；空日志同样被拒；含未结算阶段 / 缺 checkpoint / 已完成，一律拒绝恢复。</text>

  <!-- ============ 结论带 ============ -->
  <rect x="24" y="622" width="852" height="156" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="650" class="sect" fill="#b45309">两条主线（与全系列一致）</text>
  <text x="44" y="676" class="note">· <tspan font-weight="700">日志即真相</tspan>：可恢复性来自只追加 journal + 完整前缀校验，而不是一个可变的 current_stage 字段；</text>
  <text x="44" y="700" class="note">· <tspan font-weight="700">一切皆为插件</tspan>：WorkflowService 本身是 Cordis 插件，local-echo / remote 也是对等插件——新增 subagent-driven 驱动，<tspan font-weight="700">WorkflowService 一行未改</tspan>；</text>
  <text x="44" y="724" class="note">· <tspan font-weight="700">通用 Loop vs 固定 Workflow</tspan>：Loop 由模型决定下一步，Workflow 由主机固定编排 + 持久化恢复，两者互不侵入；</text>
  <text x="44" y="748" class="dim">· 代码地图：workflow.ts（Service + journal + 校验器 + 折叠）· providers.ts（两个 StageProvider 插件）· runner.ts（5 个实验）· cordis.yml（仅声明 workflows + runner）。</text>
</svg>
