<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="740" fill="#fafafa"/>
  <defs>
    <marker id="mkA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#374151"/>
    </marker>
    <marker id="mkC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="mkR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0504d"/>
    </marker>
    <style>
      .title { font-size: 19px; font-weight: 700; fill: #1a1a2e; }
      .act   { font-size: 12.5px; font-weight: 700; fill: #fff; }
      .lbl   { font-size: 10.5px; fill: #374151; }
      .lblc  { font-size: 10.5px; fill: #0891b2; }
      .lblr  { font-size: 10.5px; fill: #c0504d; }
      .sect  { font-size: 13.5px; font-weight: 700; fill: #1a1a2e; }
      .note  { font-size: 10.5px; fill: #555; }
      .dim   { font-size: 10px; fill: #6b7280; }
      .dl    { font-size: 11px; font-weight: 700; fill: #b45309; }
    </style>
  </defs>

  <text x="24" y="32" class="title">m20 · 恢复边界时序：验证完整前缀之后，才跳过重跑</text>

  <!-- ============ actors ============ -->
  <g text-anchor="middle">
    <rect x="40" y="60" width="130" height="34" rx="8" fill="#2563eb"/><text x="105" y="82" class="act">主机进程 A</text>
    <rect x="222" y="60" width="176" height="34" rx="8" fill="#7c3aed"/><text x="310" y="82" class="act">WorkflowService</text>
    <rect x="460" y="60" width="150" height="34" rx="8" fill="#0891b2"/><text x="535" y="82" class="act">Journal（磁盘）</text>
    <rect x="670" y="60" width="170" height="34" rx="8" fill="#059669"/><text x="755" y="82" class="act">StageProvider</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="105" y1="94" x2="105" y2="636"/>
    <line x1="310" y1="94" x2="310" y2="636"/>
    <line x1="535" y1="94" x2="535" y2="636"/>
    <line x1="755" y1="94" x2="755" y2="636"/>
  </g>

  <!-- ============ 阶段一：启动 → 刻意停机 ============ -->
  <text x="24" y="116" class="sect">阶段一　start：跑完前两段，落盘检查点后刻意停机</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="107" y1="134" x2="304" y2="134"/></g>
  <text x="120" y="128" class="lbl">① start(def, 'local-echo')　要求状态为空（journal 必须为空）</text>

  <g stroke="#0891b2" stroke-width="1.5" fill="none" marker-end="url(#mkC)"><line x1="312" y1="162" x2="529" y2="162"/></g>
  <text x="326" y="156" class="lblc">② append workflow_started（append-only）</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="312" y1="190" x2="749" y2="190"/></g>
  <text x="326" y="184" class="lbl">③ stage_started → provider.run(stage) → stage_completed（failure / recovery 各一次）</text>

  <g stroke="#0891b2" stroke-width="1.5" fill="none" marker-end="url(#mkC)"><line x1="312" y1="218" x2="529" y2="218"/></g>
  <text x="326" y="212" class="lblc">④ append stage_started / stage_completed ×2（含 requestId 关联）</text>

  <g stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="312" y1="246" x2="529" y2="246"/></g>
  <text x="326" y="240" class="lbl" fill="#b45309">⑤ append host_checkpoint（阶段输出已经落盘之后才写）</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="304" y1="274" x2="109" y2="274"/></g>
  <text x="120" y="268" class="lbl">⑥ 返回 outputs：刻意停机，synthesis 未跑</text>

  <!-- 重启分隔 -->
  <line x1="24" y1="300" x2="876" y2="300" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="450" y="294" text-anchor="middle" class="dl">— 主机重启 / 新实例：内存全丢，只剩磁盘上的 journal —</text>

  <!-- ============ 阶段二：恢复 ============ -->
  <text x="24" y="326" class="sect">阶段二　resume：先验证完整前缀，再折叠输出、跳过已完成</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="107" y1="344" x2="304" y2="344"/></g>
  <text x="120" y="338" class="lbl">⑦ resume(def, 'remote')　新实例，不信任任何内存状态</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="312" y1="372" x2="529" y2="372"/></g>
  <text x="326" y="366" class="lbl">⑧ readJournal()　读出 seq 0..5 全部事件</text>

  <g stroke="#0891b2" stroke-width="1.5" fill="none" marker-end="url(#mkC)"><line x1="533" y1="398" x2="314" y2="398"/></g>
  <text x="300" y="392" text-anchor="end" class="lblc">⑨ 返回事件流</text>

  <rect x="322" y="412" width="200" height="26" rx="6" fill="#fee2e2" stroke="#c0504d" stroke-dasharray="4 3"/>
  <text x="422" y="429" text-anchor="middle" class="lblr">⑩ validateJournal：完整前缀校验（8 类）</text>

  <rect x="322" y="446" width="200" height="26" rx="6" fill="#e8f3ee" stroke="#2f6f59" stroke-dasharray="4 3"/>
  <text x="422" y="463" text-anchor="middle" class="lbl" fill="#2f6f59">⑪ foldOutputs：冷重建已完成输出</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="312" y1="506" x2="749" y2="506"/></g>
  <text x="326" y="500" class="lbl">⑫ 只跑 synthesis　已完成两段：stage.id in outputs → continue（不重跑）</text>

  <g stroke="#0891b2" stroke-width="1.5" fill="none" marker-end="url(#mkC)"><line x1="312" y1="534" x2="529" y2="534"/></g>
  <text x="326" y="528" class="lblc">⑬ append stage_completed(synthesis) → workflow_completed</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="304" y1="562" x2="109" y2="562"/></g>
  <text x="120" y="556" class="lbl">⑭ 返回 3 段完整 outputs　invocationCounts 全为 1（证明未重跑）</text>

  <!-- ============ 阶段三：拒绝边界 ============ -->
  <text x="24" y="592" class="sect">阶段三　拒绝边界：日志被改动 ⇒ 恢复失败，绝不猜测兼容</text>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#mkA)"><line x1="107" y1="608" x2="304" y2="608"/></g>
  <text x="120" y="602" class="lbl">⑮ resume(…)　但日志首行 version 已被篡改：1 → 2</text>

  <g stroke="#c0504d" stroke-width="1.5" fill="none" marker-end="url(#mkR)"><line x1="304" y1="636" x2="109" y2="636"/></g>
  <text x="120" y="630" class="lblr">⑯ 抛错拒绝：[journal] version 不匹配（definition 已变更）——阶段一个都没跑</text>

  <!-- ============ 校验清单 ============ -->
  <rect x="24" y="656" width="852" height="72" rx="10" fill="#fff1f2" stroke="#c0504d" stroke-width="1.6"/>
  <text x="44" y="680" class="sect" fill="#9f1239">validateJournal 的 8 类校验（任一不通过即拒绝恢复）</text>
  <text x="44" y="702" class="note">workflow_id 匹配 · version 匹配 · seq 连续 · 阶段开始顺序 · 阶段完成顺序 · requestId 关联 · 无未结算阶段 · 有 host_checkpoint · 无 workflow_completed</text>
  <text x="44" y="720" class="dim">恢复不是"找最后一行继续"，而是"验证整个前缀之后才信任日志"——这也是 host_checkpoint 不能替代 stage_completed 作为真相来源的原因。</text>
</svg>
