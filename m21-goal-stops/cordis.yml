
# m21 · Goal 决定何时停 —— 配置驱动载体
#
# 三个 entry：
# - `./goal.ts`：GoalService（ctx.goals），GoalLoop 的 Definition + Consumer 层；
#   持有命名 Evaluator/Worker 注册表 + 只追加 goal 事件日志 + 决策状态机。
