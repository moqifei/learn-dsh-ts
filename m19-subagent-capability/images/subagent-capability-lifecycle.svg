<svg xmlns="http://www.w3.org/2000/svg" width="900" height="566" viewBox="0 0 900 566" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="566" fill="#fafafa"/>
  <defs>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0504d"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font-size: 19px; font-weight: 700; fill: #1a1a2e; }
      .st    { font-size: 14px; font-weight: 700; }
      .stsub { font-size: 10.5px; fill: #555; }
      .body  { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 10.5px; fill: #6b7280; }
      .lbl   { font-size: 10.5px; fill: #555; }
      .sect  { font-size: 14px; font-weight: 700; fill: #1a1a2e; }
      .note  { font-size: 11px; fill: #555; }
      .err   { font-size: 11px; fill: #c0504d; }
    </style>
  </defs>

  <text x="24" y="32" class="title">m19 · capability 校验、生命周期与卸载粒度</text>

  <!-- ============ 决策链 ============ -->
  <text x="24" y="60" class="sect">start(name, request) 的分发决策链：能力不支持就"响亮失败"</text>

  <g>
    <rect x="24" y="72" width="160" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="104" y="96" text-anchor="middle" class="st" fill="#1e3a8a">① 申领</text>
    <text x="104" y="116" text-anchor="middle" class="stsub">start(name, request)</text>
    <text x="104" y="134" text-anchor="middle" class="stsub">request 带能力声明</text>
  </g>
  <g>
    <rect x="198" y="72" width="160" height="78" rx="9" fill="#eef3f8" stroke="#3a6ea5" stroke-width="2"/>
    <text x="278" y="96" text-anchor="middle" class="st" fill="#1e3a8a">② 查注册表</text>
    <text x="278" y="116" text-anchor="middle" class="stsub">providers.get(name)</text>
    <text x="278" y="134" text-anchor="middle" class="stsub">命名注册表，多者共存</text>
  </g>
  <g>
    <rect x="372" y="72" width="160" height="78" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="452" y="96" text-anchor="middle" class="st" fill="#92400e">③ 能力校验</text>
    <text x="452" y="116" text-anchor="middle" class="stsub">request.outputSchema ?</text>
    <text x="452" y="134" text-anchor="middle" class="stsub">provider.capabilities 比对</text>
  </g>
  <g>
    <rect x="546" y="72" width="160" height="78" rx="9" fill="#e8f3ee" stroke="#2f6f59" stroke-width="2"/>
    <text x="626" y="96" text-anchor="middle" class="st" fill="#166534">④ 分发执行</text>
    <text x="626" y="116" text-anchor="middle" class="stsub">provider.start(request)</text>
    <text x="626" y="134" text-anchor="middle" class="stsub">铸造 runId + emit start</text>
  </g>
  <g>
    <rect x="720" y="72" width="156" height="78" rx="9" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="798" y="96" text-anchor="middle" class="st" fill="#166534">⑤ 结算</text>
    <text x="798" y="116" text-anchor="middle" class="stsub">result 结算后</text>
    <text x="798" y="134" text-anchor="middle" class="stsub">emit subagent/end</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1.8" fill="none" marker-end="url(#arrP)">
    <line x1="186" y1="111" x2="194" y2="111"/>
    <line x1="360" y1="111" x2="368" y2="111"/>
    <line x1="534" y1="111" x2="542" y2="111"/>
    <line x1="708" y1="111" x2="716" y2="111"/>
  </g>

  <!-- 失败分支 -->
  <line x1="278" y1="152" x2="278" y2="186" stroke="#c0504d" stroke-width="2" marker-end="url(#arrR)"/>
  <g>
    <rect x="198" y="188" width="160" height="56" rx="8" fill="#fee2e2" stroke="#c0504d"/>
    <text x="278" y="210" text-anchor="middle" class="body" font-weight="700" fill="#991b1b">未注册 → 抛错</text>
    <text x="278" y="230" text-anchor="middle" class="dim">未知 provider="name"（未注册）</text>
  </g>
  <line x1="452" y1="152" x2="452" y2="186" stroke="#c0504d" stroke-width="2" marker-end="url(#arrR)"/>
  <g>
    <rect x="372" y="188" width="160" height="56" rx="8" fill="#fee2e2" stroke="#c0504d"/>
    <text x="452" y="210" text-anchor="middle" class="body" font-weight="700" fill="#991b1b">缺能力 → 抛错</text>
    <text x="452" y="230" text-anchor="middle" class="dim">不支持 outputSchema 能力</text>
  </g>
  <text x="566" y="222" class="err">两处都发生在"分发之前"：绝不把不支持的请求传进后端才炸。</text>

  <!-- ============ run 句柄 / 事件 / 卸载粒度 ============ -->
  <text x="24" y="280" class="sect">产物与观测：一次性 run + 四件套事件 + 按粒度生灭</text>

  <g>
    <rect x="24" y="296" width="272" height="104" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="40" y="320" class="body" font-weight="700">SubagentRun（一次性句柄）</text>
    <text x="40" y="342" class="dim">• id：run_${++seq}</text>
    <text x="40" y="362" class="dim">• result：Promise（不 reject 子级失败）</text>
    <text x="40" y="382" class="dim">• dispose()：取消剩余工作，幂等</text>
  </g>
  <g>
    <rect x="314" y="296" width="272" height="104" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="330" y="320" class="body" font-weight="700">生命周期事件四件套</text>
    <text x="330" y="342" class="dim">• subagent/start（runId, provider, label）</text>
    <text x="330" y="362" class="dim">• subagent/end（runId, provider, stopReason）</text>
    <text x="330" y="382" class="dim">• provider-added / provider-removed</text>
  </g>
  <g>
    <rect x="604" y="296" width="272" height="104" rx="8" fill="#ffffff" stroke="#059669"/>
    <text x="620" y="320" class="body" font-weight="700">卸载粒度（实验 5 实证）</text>
    <text x="620" y="342" class="dim">卸载前：start('fork') 仍可跑</text>
    <text x="620" y="362" class="dim">卸载后：start('fork') 报"未注册"</text>
    <text x="620" y="382" class="err">spawn-in-process 不受影响仍在</text>
  </g>

  <!-- ============ 与 m18 对照 ============ -->
  <text x="24" y="426" class="sect">对照组：m18 Job vs m19 Subagent</text>

  <g>
    <rect x="24" y="442" width="414" height="88" rx="8" fill="#eef3f8" stroke="#3a6ea5"/>
    <text x="40" y="466" class="body" font-weight="700">m18 · Job（长任务）</text>
    <text x="40" y="488" class="dim">单 kind 注册表（一个 kind → 一个 Producer）</text>
    <text x="40" y="506" class="dim">无 capability 校验；产物是长生命周期、可 poll / send 的任务</text>
    <text x="40" y="524" class="dim">Producer 是插件，卸载即注销该 kind</text>
  </g>
  <g>
    <rect x="462" y="442" width="414" height="88" rx="8" fill="#e8f3ee" stroke="#2f6f59"/>
    <text x="478" y="466" class="body" font-weight="700">m19 · Subagent（本課）</text>
    <text x="478" y="488" class="dim">命名注册表（多个 Provider 按名共存，调用方挑一个）</text>
    <text x="478" y="506" class="dim">有 capability seam，缺能力即响亮失败</text>
    <text x="478" y="524" class="dim">产物是一次性 SubagentRun（result + dispose）</text>
  </g>

  <!-- ============ 结论 ============ -->
  <rect x="24" y="546" width="852" height="0" fill="none"/>
  <text x="24" y="560" class="dim">共同主线：运行时只定义契约与注册表，所有"能做什么"都由插件在运行时贡献——卸载插件即撤回能力。</text>
</svg>
