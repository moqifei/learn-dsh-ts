
# m19 · Subagent 是 capability —— 配置驱动载体
#
# 两个 entry：
# - `./subagents.ts`：SubagentRuntime 服务（注册 ctx.subagents 单例），
#   本课 "subagent capability seam" 的 Definition 层；它本身零硬编码任何 Provider。
# - `./runner.ts`：主插件（Consumer + 装配），通过 inject:['subagents'] 拿到 Runtime，
#   再用 await ctx.plugin 加载两个 "provider 能力" 插件（spawn-in-process / fork）——
#   这正是 "一切皆为插件"：连 "子代理能用哪种后端跑" 也是插件贡献的，而非写死在 Runtime 里。

- name: './subagents.ts'
- name: './runner.ts'
