<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="460" fill="#fafafa"/>
  <defs>
    <marker id="arr16b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .colh  { font-size: 15px; font-weight: 700; fill: #fff; }
      .box   { rx: 8; }
      .lbl   { font-size: 12px; fill: #333; }
      .sub   { font-size: 11px; fill: #666; }
      .note  { font-size: 12px; fill: #444; }
    </style>
  </defs>

  <text x="30" y="34" class="title">m16 · 对比：课程简化版 vs deepseek-harness 真实工程</text>

  <!-- Left: 简化版 -->
  <rect x="40" y="60" width="400" height="340" rx="10" fill="#8a8a8a" class="box"/>
  <text x="240" y="86" text-anchor="middle" class="colh">本课程简化版（聚焦主线）</text>

  <rect x="70" y="106" width="340" height="86" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
  <text x="240" y="130" text-anchor="middle" class="lbl">Session：events + surface</text>
  <text x="240" y="150" text-anchor="middle" class="sub">events 只追加（append-only 真相源）</text>
  <text x="240" y="168" text-anchor="middle" class="sub">surface 可替换投影，压缩只换它</text>
  <text x="240" y="184" text-anchor="middle" class="sub">pressure 用 UTF-8 字节粗略估算</text>

  <line x1="240" y1="192" x2="240" y2="216" stroke="#555" stroke-width="2" marker-end="url(#arr16b)"/>
  <rect x="70" y="218" width="340" height="50" rx="6" fill="#e9e9e9" stroke="#ccc" stroke-width="1.2"/>
  <text x="240" y="242" text-anchor="middle" class="lbl">CompactionEngine 抽象（extends Service）</text>
  <text x="240" y="260" text-anchor="middle" class="sub">basic / keep-recent 两个手写实现，cordis.yml 选策略</text>

  <rect x="70" y="280" width="340" height="88" rx="6" fill="#e9e9e9" stroke="#ccc" stroke-width="1.2"/>
  <text x="240" y="304" text-anchor="middle" class="lbl">刻意剥掉的工程外壳</text>
  <text x="240" y="324" text-anchor="middle" class="sub">无真实 LLM 摘要（用确定性占位，可复现）</text>
  <text x="240" y="342" text-anchor="middle" class="sub">无 token 预算（改用字节估算）</text>
  <text x="240" y="360" text-anchor="middle" class="sub">无分支上下文 / auto 模式 / 重试降级</text>

  <!-- Right: 真实工程 -->
  <rect x="460" y="60" width="400" height="340" rx="10" fill="#7b4f9e" class="box"/>
  <text x="660" y="86" text-anchor="middle" class="colh">deepseek-harness packages/agent</text>

  <rect x="490" y="106" width="340" height="86" rx="6" fill="#ffffff" stroke="#b98fd6" stroke-width="1.2"/>
  <text x="660" y="130" text-anchor="middle" class="lbl">dsh-session-basic</text>
  <text x="660" y="150" text-anchor="middle" class="sub">Event[]（只追加）+ contextWindow（投影）</text>
  <text x="660" y="168" text-anchor="middle" class="sub">contextWindowAfter 把"未来"事件纳入窗口</text>
  <text x="660" y="184" text-anchor="middle" class="sub">支撑分支上下文（branch）能力</text>

  <line x1="660" y1="192" x2="660" y2="216" stroke="#fff" stroke-width="2" marker-end="url(#arr16b)"/>
  <rect x="490" y="218" width="340" height="50" rx="6" fill="#f3e9fa" stroke="#b98fd6" stroke-width="1.2"/>
  <text x="660" y="242" text-anchor="middle" class="lbl">dsh-compaction-basic</text>
  <text x="660" y="260" text-anchor="middle" class="sub">runWithRetention + autoTrigger（压力自动触发）</text>

  <rect x="490" y="280" width="340" height="88" rx="6" fill="#f3e9fa" stroke="#b98fd6" stroke-width="1.2"/>
  <text x="660" y="304" text-anchor="middle" class="lbl">生产级完备度</text>
  <text x="660" y="324" text-anchor="middle" class="sub">真实 LLM 生成摘要 + 多 pass 摘要、引用（ref）</text>
  <text x="660" y="342" text-anchor="middle" class="sub">token 预算 + 重试/降级/可观测</text>
  <text x="660" y="360" text-anchor="middle" class="sub">compaction-basic / command-compact / pruner 多实现</text>

  <text x="30" y="430" class="note">两边核心四件事完全一致：events 只追加 → stable-range 保留 → 工具结果剪枝 → 摘要替换投影；差异只在真实 LLM 摘要、token 预算、分支上下文这些工程外壳。</text>
</svg>
