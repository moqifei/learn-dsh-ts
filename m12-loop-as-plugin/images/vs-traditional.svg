<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="460" fill="#fafafa"/>
  <defs>
    <marker id="arr12b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .colh  { font-size: 15px; font-weight: 700; fill: #fff; }
      .box   { rx: 8; }
      .lbl   { font-size: 12px; fill: #333; }
      .sub   { font-size: 11px; fill: #666; }
      .note  { font-size: 12px; fill: #444; }
    </style>
  </defs>

  <text x="30" y="34" class="title">m12 · 对比：传统写死的 Loop vs Loop 也是插件</text>

  <!-- Left: 传统写死 -->
  <rect x="40" y="60" width="400" height="340" rx="10" fill="#8a8a8a" class="box"/>
  <text x="240" y="86" text-anchor="middle" class="colh">传统框架：循环写死在内核</text>

  <rect x="70" y="106" width="340" height="86" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1.2"/>
  <text x="240" y="130" text-anchor="middle" class="lbl">一个大 Agent 类装下一切</text>
  <text x="240" y="150" text-anchor="middle" class="sub">class Agent { ... }</text>
  <text x="240" y="168" text-anchor="middle" class="sub">循环 + 模型适配器 + 工具</text>
  <text x="240" y="184" text-anchor="middle" class="sub">都写在同一个类里</text>

  <line x1="240" y1="192" x2="240" y2="216" stroke="#555" stroke-width="2" marker-end="url(#arr12b)"/>
  <rect x="70" y="218" width="340" height="50" rx="6" fill="#e9e9e9" stroke="#ccc" stroke-width="1.2"/>
  <text x="240" y="242" text-anchor="middle" class="lbl">换模型 / 换存储 = 改内核</text>
  <text x="240" y="260" text-anchor="middle" class="sub">每次替换都要动核心代码</text>

  <rect x="70" y="280" width="340" height="88" rx="6" fill="#e9e9e9" stroke="#ccc" stroke-width="1.2"/>
  <text x="240" y="304" text-anchor="middle" class="lbl">编排无法复用</text>
  <text x="240" y="324" text-anchor="middle" class="sub">import 具体实现，耦合到底</text>
  <text x="240" y="342" text-anchor="middle" class="sub">换驱动器要重写循环</text>
  <text x="240" y="360" text-anchor="middle" class="sub">回归风险高，难以单测</text>

  <!-- Right: 插件化 -->
  <rect x="460" y="60" width="400" height="340" rx="10" fill="#7b4f9e" class="box"/>
  <text x="660" y="86" text-anchor="middle" class="colh">Loop 也是插件（本课）</text>

  <rect x="490" y="106" width="340" height="86" rx="6" fill="#ffffff" stroke="#b98fd6" stroke-width="1.2"/>
  <text x="660" y="130" text-anchor="middle" class="lbl">AgentLoop extends Service</text>
  <text x="660" y="150" text-anchor="middle" class="sub">static inject = [llm, session,</text>
  <text x="660" y="168" text-anchor="middle" class="sub">prompt, tools]，声明依赖</text>
  <text x="660" y="184" text-anchor="middle" class="sub">能力由服务解析注入，不 import</text>

  <line x1="660" y1="192" x2="660" y2="216" stroke="#fff" stroke-width="2" marker-end="url(#arr12b)"/>
  <rect x="490" y="218" width="340" height="50" rx="6" fill="#f3e9fa" stroke="#b98fd6" stroke-width="1.2"/>
  <text x="660" y="242" text-anchor="middle" class="lbl">换能力 = 换插件</text>
  <text x="660" y="260" text-anchor="middle" class="sub">Loop 代码零改动</text>

  <rect x="490" y="280" width="340" height="88" rx="6" fill="#f3e9fa" stroke="#b98fd6" stroke-width="1.2"/>
  <text x="660" y="304" text-anchor="middle" class="lbl">编排可复用、可替换</text>
  <text x="660" y="324" text-anchor="middle" class="sub">换 provider：换 llm 插件</text>
  <text x="660" y="342" text-anchor="middle" class="sub">卸载工具：模型自适应直答</text>
  <text x="660" y="360" text-anchor="middle" class="sub">换驱动器：提供新 agent 服务</text>

  <text x="30" y="430" class="note">左边是"循环即内核，一切硬编码"；右边是"循环即插件，只声明依赖与编排顺序"——这正是 deepseek-harness s13 的设计（示例仅把真实 LLM 换成确定性脚本模型）。</text>
</svg>
