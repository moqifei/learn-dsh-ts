<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-label="外部能力接入架构：定义 / 提供者 / 消费者 一刀切开" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="720" fill="#fafafa"/>
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <style>
      .title { font-size: 19px; font-weight: 700; fill: #1a1a2e; }
      .sect  { font-size: 14px; font-weight: 700; fill: #1a1a2e; }
      .lhead { font-size: 12.5px; font-weight: 700; fill: #fff; }
      .body  { font-size: 11.5px; fill: #374151; }
      .dim   { font-size: 10.5px; fill: #6b7280; }
      .edge  { font-size: 10.5px; fill: #555; }
      .note  { font-size: 11px; fill: #555; }
      .ctit  { font-size: 11.5px; font-weight: 700; fill: #1a1a2e; }
      .st    { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <text x="24" y="32" class="title">m22 · 外部能力接入 — 定义 / 提供者 / 消费者 一刀切开</text>

  <!-- ============ ① 三角色 ============ -->
  <text x="24" y="60" class="sect">① 三角色：契约 / 连接插件 / 消费者各归其位</text>

  <!-- Definition -->
  <g>
    <rect x="24" y="70" width="196" height="200" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M24,80 a10,10 0 0 1 10,-10 h176 a10,10 0 0 1 10,10 v24 h-196 z" fill="#7c3aed"/>
    <text x="122" y="92" text-anchor="middle" class="lhead">Definition · 契约</text>
    <text x="40" y="126" class="body">• ExternalCapabilityProvider</text>
    <text x="40" y="146" class="body">• namespace：命名空间前缀</text>
    <text x="40" y="166" class="body">• listTools()：发现工具</text>
    <text x="40" y="186" class="body">• close()：撤销连接副作用</text>
    <text x="40" y="206" class="body">• 只说"能力是什么"</text>
    <text x="40" y="226" class="body">• 不含任何连接细节</text>
    <text x="40" y="250" class="dim">（契约稳定，消费者不感知）</text>
  </g>

  <!-- Provider -->
  <g>
    <rect x="316" y="70" width="224" height="200" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M316,80 a10,10 0 0 1 10,-10 h204 a10,10 0 0 1 10,10 v24 h-224 z" fill="#2f6f59"/>
    <text x="428" y="92" text-anchor="middle" class="lhead">Provider · 连接型插件</text>
    <text x="332" y="126" class="body">core：进程内函数，无连接</text>
    <text x="332" y="146" class="body">mcp：子进程 / socket 连接</text>
    <text x="332" y="166" class="body">web：真实 HTTP 服务器连接</text>
    <text x="332" y="186" class="body">lsp：JSON-RPC 子进程连接</text>
    <text x="332" y="206" class="body">• 每个都是一个 cordis 插件</text>
    <text x="332" y="226" class="body">• 唯一区别 = 挂载副作用类型</text>
    <text x="332" y="250" class="dim">activation 注册 → 卸载自动撤销</text>
  </g>

  <!-- Consumer -->
  <g>
    <rect x="628" y="70" width="248" height="200" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <path d="M628,80 a10,10 0 0 1 10,-10 h228 a10,10 0 0 1 10,10 v24 h-248 z" fill="#2563eb"/>
    <text x="752" y="92" text-anchor="middle" class="lhead">Consumer · ctx.external</text>
    <text x="644" y="126" class="body">• schemas() 投影工具菜单</text>
    <text x="644" y="146" class="body">• execute(name,args) 按名分发</text>
    <text x="644" y="166" class="body">• 只看到 cap__* 一个列表</text>
    <text x="644" y="186" class="body">• 不问来自进程内 / 网络</text>
    <text x="644" y="206" class="body">• 工具变化 → 监听 tools/change</text>
    <text x="644" y="226" class="body">• Agent Loop 只按 name 消费</text>
    <text x="644" y="250" class="dim">CapabilityRuntime（Service 单例）</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1.6" fill="none" marker-end="url(#arrA)">
    <line x1="220" y1="170" x2="314" y2="170"/>
    <line x1="540" y1="170" x2="626" y2="170"/>
  </g>
  <text x="267" y="162" text-anchor="middle" class="edge">由 Provider 实现</text>
  <text x="583" y="162" text-anchor="middle" class="edge">挂进同一棵树</text>

  <!-- ============ ② 主链路 ============ -->
  <text x="24" y="296" class="sect">② 主链路：发现 → 命名 → 挂载进同一棵 ctx.tools → 投影 → 按名分发</text>

  <g>
    <rect x="29" y="312" width="132" height="64" rx="9" fill="#e7f1f5" stroke="#2563eb" stroke-width="1.6"/>
    <text x="95" y="336" text-anchor="middle" class="st" fill="#2563eb">① 发现</text>
    <text x="95" y="358" text-anchor="middle" class="dim">listTools()</text>
  </g>
  <g>
    <rect x="171" y="312" width="132" height="64" rx="9" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="237" y="336" text-anchor="middle" class="st" fill="#7c3aed">② 命名</text>
    <text x="237" y="358" text-anchor="middle" class="dim">cap__&lt;p&gt;__local</text>
  </g>
  <g>
    <rect x="313" y="312" width="132" height="64" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="379" y="336" text-anchor="middle" class="st" fill="#b45309">③ 挂载</text>
    <text x="379" y="358" text-anchor="middle" class="dim">进 ctx.tools</text>
  </g>
  <g>
    <rect x="455" y="312" width="132" height="64" rx="9" fill="#fee2e2" stroke="#c0504d" stroke-width="1.6"/>
    <text x="521" y="336" text-anchor="middle" class="st" fill="#c0504d">④ 投影</text>
    <text x="521" y="358" text-anchor="middle" class="dim">schemas()</text>
  </g>
  <g>
    <rect x="597" y="312" width="132" height="64" rx="9" fill="#e8f3ee" stroke="#2f6f59" stroke-width="1.6"/>
    <text x="663" y="336" text-anchor="middle" class="st" fill="#2f6f59">⑤ 分发</text>
    <text x="663" y="358" text-anchor="middle" class="dim">execute(name)</text>
  </g>
  <g>
    <rect x="739" y="312" width="132" height="64" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
    <text x="805" y="336" text-anchor="middle" class="st" fill="#059669">⑥ 变更</text>
    <text x="805" y="358" text-anchor="middle" class="dim">tools/change</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#arrA)">
    <line x1="161" y1="344" x2="168" y2="344"/>
    <line x1="303" y1="344" x2="310" y2="344"/>
    <line x1="445" y1="344" x2="452" y2="344"/>
    <line x1="587" y1="344" x2="594" y2="344"/>
    <line x1="729" y1="344" x2="736" y2="344"/>
  </g>

  <!-- ============ ③ 同一棵树 ============ -->
  <text x="24" y="400" class="sect">③ 同一棵 ctx.tools 树（core 与 external 混排，一眼看不出差别）</text>
  <rect x="29" y="416" width="842" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="52" y="448" class="ctit">cap__core__add</text>
  <text x="848" y="448" text-anchor="end" class="dim">进程内函数，无连接</text>

  <text x="52" y="478" class="ctit">cap__mcp__length</text>
  <text x="848" y="478" text-anchor="end" class="dim">子进程 / socket 连接转发</text>

  <text x="52" y="508" class="ctit">cap__web__status</text>
  <text x="848" y="508" text-anchor="end" class="dim">真实跨网络 HTTP（回环 127.0.0.1）</text>

  <text x="52" y="538" class="ctit">cap__lsp__symbol</text>
  <text x="848" y="538" text-anchor="end" class="dim">真实跨进程 JSON-RPC 子进程</text>

  <!-- ============ 结论带 ============ -->
  <rect x="24" y="566" width="852" height="136" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="44" y="594" class="sect" fill="#b45309">两条主线（与全系列一致）</text>
  <text x="44" y="620" class="note">· <tspan font-weight="700">外部能力即插件</tspan>：MCP / Web / LSP 都只是"对同一棵 ctx.tools 贡献工具"的 Provider 插件，不是 Agent 里的特殊分支；</text>
  <text x="44" y="644" class="note">· <tspan font-weight="700">一切皆为插件</tspan>：registerProvider 是 ctx.effect，卸载插件即撤销其工具 + emit('tools/change')，CapabilityRuntime 与 Loop 零改动；</text>
  <text x="44" y="668" class="note">· <tspan font-weight="700">命名空间隔离</tspan>：工具名形如 cap__&lt;provider&gt;__&lt;localName&gt;，能力互不知道彼此，挂载顺序无所谓。</text>
  <text x="44" y="690" class="dim">代码地图：external.ts（ToolRegistry + CapabilityRuntime）· providers.ts（core / mcp / web / lsp 四插件）· runner.ts（六个实验）· lsp-server.js（教学版 LSP 子进程）</text>
</svg>
