<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" font-family="Menlo, Consolas, monospace">
  <rect width="860" height="540" fill="#fafafa"/>
  <text x="20" y="34" font-size="18" font-weight="bold" fill="#222">m05 事件与 waterfall：同一条事件总线上的两种分发模式</text>
  <text x="20" y="54" font-size="12" fill="#888">ctx.on(name, listener) 注册的监听器都进同一个 ctx.events._hooks[name]；区别只在触发方选了 emit 还是 waterfall</text>

  <!-- 统一总线 -->
  <rect x="320" y="70" width="220" height="64" rx="10" fill="#fff" stroke="#37474f" stroke-width="2"/>
  <text x="332" y="98" font-size="14" font-weight="bold" fill="#37474f">事件总线 ctx.events</text>
  <text x="332" y="120" font-size="11" fill="#607d8b">ctx.on('name', listener) 统一注册</text>

  <!-- 总线分叉到两条模式 -->
  <g stroke="#607d8b" stroke-width="2" marker-end="url(#arrowG)">
    <line x1="430" y1="134" x2="430" y2="160"/>
  </g>

  <!-- ============== 模式 A · emit 扇出 ============== -->
  <!-- 外框：x=40, y=160, w=370, h=200  (y 范围 160-360) -->
  <rect x="40" y="160" width="370" height="200" rx="8" fill="#fff" stroke="#1976d2"/>
  <text x="54" y="184" font-size="13" font-weight="bold" fill="#1976d2">模式 A · emit('stats/report')</text>
  <text x="54" y="202" font-size="11" fill="#888">DispatchMode='emit'：遍历监听器</text>

  <!-- Stats.bump 触发框：x=60, y=220, w=110, h=36  (220-256) -->
  <rect x="60" y="220" width="110" height="36" rx="6" fill="#fff3e0" stroke="#f57c00"/>
  <text x="115" y="242" font-size="11" fill="#f57c00" text-anchor="middle">Stats.bump()</text>

  <!-- 三个 observer 框：x=240, y=222/260/298, w=160, h=28（避开副标题 y=202 区域） -->
  <rect x="240" y="222" width="160" height="28" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="320" y="241" font-size="11" fill="#1976d2" text-anchor="middle">console-observer</text>
  <rect x="240" y="260" width="160" height="28" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="320" y="279" font-size="11" fill="#1976d2" text-anchor="middle">log-observer</text>
  <rect x="240" y="298" width="160" height="28" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="320" y="317" font-size="11" fill="#1976d2" text-anchor="middle">temp-observer（可卸载）</text>

  <!-- 箭头：Stats.bump 右边 (x=170) → 三个 observer 左边 (x=235) -->
  <g stroke="#1976d2" stroke-width="2" marker-end="url(#arrowB)">
    <line x1="170" y1="238" x2="235" y2="236"/>
    <line x1="170" y1="238" x2="235" y2="274"/>
    <line x1="170" y1="238" x2="235" y2="312"/>
  </g>

  <!-- 底部脚注：y=346（在 temp-observer y=326 之下 20px） -->
  <text x="54" y="346" font-size="10.5" fill="#888">移除任一 observer，Stats 不受影响</text>

  <!-- ============== 模式 B · waterfall 洋葱链 ============== -->
  <!-- 外框：x=450, y=160, w=370, h=200  (y 范围 160-360) -->
  <rect x="450" y="160" width="370" height="200" rx="8" fill="#fff" stroke="#8e24aa"/>
  <text x="464" y="184" font-size="13" font-weight="bold" fill="#8e24aa">模式 B · waterfall('prompt/build')</text>
  <text x="464" y="202" font-size="11" fill="#888">DispatchMode='waterfall'：next() 包装链</text>

  <!-- chunk-greeting 外层：x=540, y=234, w=190, h=36  (234-270) -->
  <rect x="540" y="234" width="190" height="36" rx="6" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="635" y="256" font-size="11" fill="#8e24aa" text-anchor="middle">chunk-greeting（外层）</text>

  <!-- 箭头：greeting 底 (y=270) → rules 顶 (y=290) -->
  <line x1="635" y1="270" x2="635" y2="290" stroke="#8e24aa" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- chunk-rules 内层基座：x=540, y=290, w=190, h=36  (290-326) -->
  <rect x="540" y="290" width="190" height="36" rx="6" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="635" y="312" font-size="11" fill="#8e24aa" text-anchor="middle">chunk-rules（内层基座）</text>

  <!-- 底部脚注：y=346 -->
  <text x="464" y="346" font-size="10.5" fill="#888">调用 next() 交给下游；不调则接管</text>

  <!-- ============== 内核也走同一条总线 ============== -->
  <!-- 外框：x=40, y=385, w=780, h=120  (385-505) -->
  <rect x="40" y="385" width="780" height="120" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="56" y="410" font-size="13" font-weight="bold" fill="#2e7d32">同一总线上的内核内置事件（全部 @mode waterfall）</text>

  <!-- 4 个内部事件：y=430, h=34  (430-464) -->
  <rect x="56" y="430" width="180" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="146" y="452" font-size="11" fill="#2e7d32" text-anchor="middle">internal/config</text>
  <rect x="246" y="430" width="180" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="336" y="452" font-size="11" fill="#2e7d32" text-anchor="middle">internal/update</text>
  <rect x="436" y="430" width="180" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="526" y="452" font-size="11" fill="#2e7d32" text-anchor="middle">internal/get</text>
  <rect x="626" y="430" width="180" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="716" y="452" font-size="11" fill="#2e7d32" text-anchor="middle">internal/set</text>

  <!-- 角色说明 -->
  <text x="56" y="488" font-size="10.5" fill="#888">配置解析 · 热更新 · 服务读拦截 · 服务写拦截 — 证明框架核心也用 ctx.on + waterfall 触发</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#607d8b"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1976d2"/>
    </marker>
    <marker id="arrowP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8e24aa"/>
    </marker>
  </defs>
</svg>
